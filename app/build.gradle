plugins {
    id 'com.android.application'
}

// Varias librerías de AndroidX traen por transitividad dos variantes del
// Kotlin stdlib (kotlin-stdlib y las antiguas kotlin-stdlib-jdk7/jdk8, que
// desde Kotlin 1.8 ya están fusionadas en la principal). Esto provoca el
// error "Duplicate class ... found in modules kotlin-stdlib-1.8.20.jar".
// Se excluyen las variantes viejas para que Gradle solo use kotlin-stdlib.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'com.examen.chatapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.examen.chatapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.core:core:1.10.1'
}
